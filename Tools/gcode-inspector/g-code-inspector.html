<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-code Inspector — FibreSeeker 3</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171b22; --panel2: #1e242e; --line: #2a323f;
    --fg: #dfe6ef; --dim: #8b98a9; --acc: #4aa8ff;
    --critical: #ff5b5b; --warning: #ffb443; --info: #57c98b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--dim); font-size: 12px; }
  main { padding: 18px 20px 60px; max-width: 1500px; margin: 0 auto; }
  .bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .bar label { color: var(--dim); font-size: 12px; display: flex; gap: 5px; align-items: center; }
  .bar input[type=number] { width: 68px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
  button, .filebtn {
    background: var(--acc); color: #04121f; border: 0; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button.ghost { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=file] { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; }
  .card .num { font-size: 22px; font-weight: 700; }
  .card .lbl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; background: var(--panel); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--panel2); }
  tr.sel td { background: #1b2b3d; }
  .sev { font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: .5px; }
  .sev.critical { color: var(--critical); }
  .sev.warning { color: var(--warning); }
  .sev.info { color: var(--info); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); font-size: 11px; }
  .pill.hit { border-color: var(--acc); color: var(--acc); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  summary { cursor: pointer; font-weight: 600; }
  .findings { max-height: 460px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; }
  .muted { color: var(--dim); }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }
  .drop { border: 1px dashed var(--line); border-radius: 8px; padding: 26px; text-align: center; color: var(--dim); margin-bottom: 16px; }
  .drop.over { border-color: var(--acc); color: var(--acc); }
  .split { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 70px; }
  .hist div { flex: 1; background: var(--acc); min-height: 1px; border-radius: 2px 2px 0 0; }
  a { color: var(--acc); }
</style>
</head>
<body>
<header>
  <h1>FibreSeeker 3 G-code Inspector</h1>
  <span class="sub">static analyser for Rocket Slicer output &mdash; files are read locally and never leave this tab</span>
</header>

<main>
  <div class="bar">
    <label class="filebtn" for="files">Choose .gcode files</label>
    <input type="file" id="files" multiple accept=".gcode,.gco,.g,.txt">
    <button id="run" disabled>Inspect</button>
    <label>cell <input type="number" id="cell" value="0.2" step="0.05" min="0.1" max="1"> mm</label>
    <label>gap &times;bead <input type="number" id="gapRatio" value="1.5" step="0.1" min="1" max="4"></label>
    <label>unsupported floor <input type="number" id="minUnsup" value="16" step="1" min="2"> mm</label>
    <label>seam run <input type="number" id="minSeam" value="10" step="1" min="2"> layers</label>
    <label><input type="checkbox" id="coverage" checked> coverage raster</label>
    <button class="ghost" id="export">Export JSON</button>
    <span class="muted" id="status"></span>
  </div>

  <div class="drop" id="drop">Drop <span class="mono">.gcode</span> files here, or use “Choose .gcode files”. Files never leave the browser.</div>

  <div id="out"></div>
</main>

<script>
/* Bundled engine — generated by build_bundle.js from:
   src/dialect.js, src/raster.js, src/inspector.js
   Do not edit this file by hand; edit src/*.js and re-run the builder. */
/* ===== src/dialect.js ===== */
/*
 * FibreSeeker 3 G-code Inspector — dialect helpers
 *
 * Everything the Rocket Slicer emits that a generic G-code parser gets wrong is
 * centralised here (see GCODE_REFERENCE.md in this repository):
 *   - `U` / `V` are relative extrusion axes (a fiber move has no `E` word at all)
 *   - `P` on a G1 move is a fiber process parameter, not dwell/probe
 *   - layer markers are `; LAYER:<1-based> [<absolute Z>]` (space after `;`)
 *   - feature type comes from `; <Feature> start` comments, not `;TYPE:`
 *   - `M106 P<n> S<...>` is a multi-port fan selector
 *   - `; MATERIAL_PRINT_DATA:` is the slicer's declared per-tool material use
 *   - machine-assist features (AI detection, bed mesh, runout) can only appear
 *     as executable commands — see MACHINE_FLAGS
 *
 * OrcaSlicer / PrusaSlicer output is also recognised, because the same engine
 * has to read it: features come from `;TYPE:<role>` (TYPE_FEATURES), bead widths
 * from `; <role> extrusion width = <n>mm` header lines (TYPE_WIDTH_LINES), and
 * profile settings from a flat `; <key> = <value>` config dump (parseConfigDump
 * + flatSettings) instead of a `; SESSION:` JSON blob. The Rocket-only readers
 * are untouched, so a Rocket file never reaches the flat-config path.
 *
 * Loaded as a plain browser script (attaches to window.FS3) or via require() in Node.
 */
(function (root) {
  'use strict';

  // ---- verbs -------------------------------------------------------------
  var MOTION_VERBS = { G0: 1, G1: 1 };
  var STANDARD_G = {
    G0: 1, G1: 1, G4: 1, G10: 1, G11: 1, G21: 1, G28: 28, G90: 1, G91: 1, G92: 1
  };
  // M73 is universal progress reporting (Klipper and Marlin both implement it),
  // so flagging it as an undefined verb is noise rather than a contract finding.
  var STANDARD_M = {
    M82: 1, M83: 1, M104: 1, M106: 1, M107: 1, M109: 1, M112: 1, M115: 1, M118: 1,
    M140: 1, M141: 1, M190: 1, M191: 1, M203: 1, M204: 1, M205: 1, M220: 1, M221: 1,
    M400: 1, M600: 1, M605: 1, M73: 1, M1001: 1, M1002: 1, M2800: 1
  };
  // Macros the slicer/firmware contract documents as defined (GCODE_REFERENCE.md §3).
  var KNOWN_MACROS = {
    MOVE_TO_BRUSH_STATION: 1,
    CLEAN_NOZZLE: 1,
    MOVE_OUT_BRUSH_STATION: 1,
    SET_PRINT_STATS_INFO: 1,
    SET_PRINT_PREP_STAGE: 1,
    SET_PRESSURE_ADVANCE: 1,
    SET_VELOCITY_LIMIT: 1,
    SET_TOOL_CORNER_VELOCITY: 1,
    PRINT_START: 1,
    PRINT_RESUME: 1,
    PRINT_CANCEL: 1,
    GCODE: 1
  };

  // ---- feature sections --------------------------------------------------
  // name -> {type, entity key used for bead width, wall: is this a perimeter?}
  var FEATURES = {
    'Inset 0': { type: 'WALL', entity: 'INSET0', wall: true },
    'Inset XP': { type: 'WALL', entity: 'INSET_XP', wall: true },
    'Inset XF': { type: 'WALL', entity: 'INSET_XF', wall: true },
    'Cellular infill': { type: 'FILL', entity: 'INFILL_CELLULAR_P' },
    'Micro infill': { type: 'SOLID', entity: 'MICRO_INFILL_P' },
    'Solid infill': { type: 'SOLID', entity: 'INFILL_SOLID_P' },
    'Top most solid infill': { type: 'TOP', entity: 'INFILL_SOLID_P_TOP_MOST' },
    'Top intermediate solid infill': { type: 'TOP', entity: 'INFILL_SOLID_P_TOP_INTERMEDIATE' },
    'Bottom most solid infill': { type: 'BOTTOM', entity: 'INFILL_SOLID_P_BOTTOM_MOST' },
    'Bottom intermediate solid infill': { type: 'BOTTOM', entity: 'INFILL_SOLID_P_BOTTOM_INTERMEDIATE' },
    'Bridge solid infill': { type: 'BRIDGE', entity: 'BRIDGE_SOLID_INFILL' },
    'Overhang infill': { type: 'OVERHANG', entity: 'OVERHANG_INFILL' },
    'Overhang solid infill': { type: 'OVERHANG', entity: 'OVERHANG_SOLID_INFILL' },
    'Fiber infill': { type: 'FIBER', entity: 'INFILL_FIBER' },
    'Replace fiber plastic solid infill': { type: 'SOLID', entity: 'REPLACE_FIBER_PLASTIC_SOLID' },
    'Support thick': { type: 'SUPPORT', entity: 'SUPPORT_THICK' },
    'Support thin': { type: 'SUPPORT', entity: 'SUPPORT_THIN' },
    'Support interface': { type: 'SUPPORT', entity: 'SUPPORT_INTERFACE' },
    'Skirt': { type: 'SKIRT', entity: 'SKIRT' },
    'Brim': { type: 'BRIM', entity: 'BRIM' },
    'Priming line': { type: 'PRIMING', entity: 'FIBER_PREPARATION' },
    'Wipe tower': { type: 'WIPE', entity: 'WIPE_TOWER' }
  };

  // ---- OrcaSlicer / PrusaSlicer `;TYPE:` roles -----------------------------
  // Same contract as FEATURES: a type label plus the width key to look up in the
  // header's extrusion-width lines, and `wall` for the coverage raster. Without
  // this map every bead on an Orca file is UNKNOWN and falls back to the 0.4 mm
  // default instead of the header's declared 0.42 mm.
  var TYPE_FEATURES = {
    'Outer wall': { type: 'WALL', entity: 'INSET0', wall: true },
    'Inner wall': { type: 'WALL', entity: 'INSET_XP', wall: true },
    'Sparse infill': { type: 'FILL', entity: 'INFILL_CELLULAR_P' },
    'Internal solid infill': { type: 'SOLID', entity: 'INFILL_SOLID_P' },
    'Top surface': { type: 'TOP', entity: 'INFILL_SOLID_P_TOP_MOST' },
    'Bottom surface': { type: 'BOTTOM', entity: 'INFILL_SOLID_P_BOTTOM_MOST' },
    'Support': { type: 'SUPPORT', entity: 'SUPPORT_THICK' },
    'Support material': { type: 'SUPPORT', entity: 'SUPPORT_THICK' },
    'Support base': { type: 'SUPPORT', entity: 'SUPPORT_THICK' },
    'Support interface': { type: 'SUPPORT', entity: 'SUPPORT_INTERFACE' },
    'Support roof': { type: 'SUPPORT', entity: 'SUPPORT_INTERFACE' },
    'Skirt': { type: 'SKIRT', entity: 'SKIRT' },
    'Brim': { type: 'BRIM', entity: 'BRIM' },
    'Brim_EligibleSpace': { type: 'BRIM', entity: 'BRIM' },
    'Wipe tower': { type: 'WIPE', entity: 'WIPE_TOWER' },
    'Wipe tower purge': { type: 'WIPE', entity: 'WIPE_TOWER' },
    'Purge line': { type: 'PRIMING', entity: 'FIBER_PREPARATION' },
    // `;TYPE:Custom` brackets preamble/postamble and tool changes. It is not a
    // geometry role, so it maps to no printable feature — tracked here so it is
    // not reported as an unknown role.
    'Custom': { type: 'CUSTOM', entity: 'UNKNOWN' }
  };

  // Orca/Prusa header width lines, `; external perimeters extrusion width =
  // 0.42mm`, keyed by role text and mapped onto the FEATURES entity keys.
  var TYPE_WIDTH_LINES = {
    'external perimeters': 'INSET0',
    'perimeters': 'INSET_XP',
    'infill': 'INFILL_CELLULAR_P',
    'solid infill': 'INFILL_SOLID_P',
    'top infill': 'INFILL_SOLID_P_TOP_MOST',
    'first layer': 'FIRST_LAYER'
  };

  // Fallback bead widths (mm) when the SESSION echo has no EntitySizes entry.
  var DEFAULT_WIDTH = {
    INSET0: 0.4, INSET_XP: 0.4, INSET_XF: 0.8, INFILL_CELLULAR_P: 0.45,
    MICRO_INFILL_P: 0.4, INFILL_SOLID_P: 0.35, INFILL_SOLID_P_TOP: 0.4,
    INFILL_SOLID_P_TOP_MOST: 0.4, INFILL_SOLID_P_TOP_INTERMEDIATE: 0.4,
    INFILL_SOLID_P_BOTTOM: 0.4, INFILL_SOLID_P_BOTTOM_MOST: 0.4,
    INFILL_SOLID_P_BOTTOM_INTERMEDIATE: 0.4, BRIDGE_SOLID_INFILL: 0.4,
    OVERHANG_INFILL: 0.4, OVERHANG_SOLID_INFILL: 0.35, INFILL_FIBER: 0.8,
    REPLACE_FIBER_PLASTIC_SOLID: 0.4, SUPPORT_THICK: 0.4, SUPPORT_THIN: 0.4,
    SUPPORT_INTERFACE: 0.4, SKIRT: 0.54, BRIM: 0.4, FIBER_PREPARATION: 0.8,
    WIPE_TOWER: 0.4
  };

  // Comment-embedded numbers follow the slicer host's locale, so a file can
  // declare `; LAYER:1 [0,2]` and `; SEAM Plastic at X31,150` while the G-code
  // body still uses dots (`X81.634`). Every comment-side number goes through
  // num() so a comma decimal separator cannot silently drop a layer marker.
  var RE_LAYER = /^;\s*LAYER:(\d+)\s*\[([^\]]+)\]/;
  var RE_MACROLAYER = /^;\s*MACROLAYER:/;
  var RE_SEAM = /^;\s*SEAM\s+(Plastic|Fiber)\s+at\s+X([-\d.,]+)\s+Y([-\d.,]+)\s+Z([-\d.,]+)/;
  // Modal bead geometry. Rocket emits the width and height of the *next* move as
  // a comment pair immediately before it, so these are modal metadata, not
  // per-feature constants: a tapering gap-fill run changes width every line.
  var RE_LINE_WIDTH = /^;\s*LINE_WIDTH:\s*([-\d.,]+)/;
  var RE_ENTITY_LINE_HEIGHT = /^;\s*ENTITY_LINE_HEIGHT:\s*([-\d.,]+)/;
  // Parse a comment-side number tolerating a comma decimal separator. When both
  // separators appear the comma is a thousands group, so it is simply dropped.
  function num(text) {
    if (typeof text === 'number') return text;
    var s = String(text).trim();
    if (s.indexOf(',') === -1) return parseFloat(s);
    if (s.indexOf('.') === -1) return parseFloat(s.replace(',', '.'));
    return parseFloat(s.replace(/,/g, ''));
  }
  var RE_SECTION = /^;\s*(.+?)\s+(start|end)\s*$/;
  // OrcaSlicer / PrusaSlicer markers and header lines.
  var RE_TYPE = /^;\s*TYPE:\s*(.+?)\s*$/;
  var RE_GEN_ORCA = /^;\s*generated by (.+)$/;
  // Orca writes `; total layer number: 32` in the header block and
  // `; total layers count = 32` in the summary block; Prusa writes the latter.
  var RE_LAYERCOUNT_ORCA = /^;\s*total (?:layer number|layers count)\s*[:=]\s*(\d+)/i;
  // `; <key> = <value>` config dump. Keys are lower snake_case in every
  // Orca/Prusa export; requiring that shape keeps `; filament used [g] = 0.94`
  // and `; thumbnail begin …` out of the parse.
  var RE_CONFIG_LINE = /^;\s*([a-z][a-z0-9_]*)\s*=\s*(.*)$/;
  var RE_EW_LINE = /^;\s*(.+?)\s+extrusion width\s*=\s*([\d.,]+)\s*mm/;
  var RE_SESSION = /^;\s*SESSION:\s*/;
  var RE_MATERIAL = /^;\s*MATERIAL_PRINT_DATA:\s*/;
  var RE_ENTITY = /^;\s*ENTITY_PRINT_DATA:\s*/;
  var RE_THUMB_START = /^;\s*thumbnail start/;
  var RE_GEN = /^;\s*Generated with (.+)$/;
  var RE_PROC = /^;\s*Printer Processor Type:\s*(.+)$/;
  var RE_MODE = /^;\s*PRINTING_MODE:\s*(.+)$/;
  var RE_LAYERCOUNT = /^;\s*LAYER_COUNT:\s*(\d+)/;

  // ---- line parsing ------------------------------------------------------
  function parseLine(line) {
    var semi = line.indexOf(';');
    var code = semi === -1 ? line : line.slice(0, semi);
    var comment = semi === -1 ? '' : line.slice(semi);
    var out = {
      verb: '', code: code.trim(), comment: comment, args: null,
      isComment: /^\s*;/.test(line)
    };
    if (!out.code) return out;

    var parts = out.code.split(/[\s,]+/);
    out.verb = parts[0].toUpperCase();
    var args = {};
    for (var i = 1; i < parts.length; i++) {
      var p = parts[i];
      if (!p) continue;
      var k = p.charAt(0).toUpperCase();
      var v = parseFloat(p.slice(1));
      if (!isNaN(v)) args[k] = v;
      else if (/^[A-Z_]+$/.test(p)) args[p] = true;
    }
    out.args = args;
    return out;
  }

  // Extrusion axes: E (plastic), U (fiber), V (matrix). All relative (M83).
  function extrusionDeltas(args, absE, lastE) {
    var dE = 0, dU = 0, dV = 0;
    if (args.E !== undefined) dE = absE ? args.E - lastE : args.E;
    if (args.U !== undefined) dU = args.U;
    if (args.V !== undefined) dV = args.V;
    return { dE: dE, dU: dU, dV: dV };
  }

  function isCustomVerb(verb, extraDefined) {
    if (!verb) return false;
    if (MOTION_VERBS[verb]) return false;
    if (STANDARD_G[verb]) return false;
    if (STANDARD_M[verb]) return false;
    if (/^T\d+$/.test(verb)) return false;
    if (KNOWN_MACROS[verb]) return false;
    if (extraDefined && extraDefined[verb]) return false;
    return true;
  }

  // ---- SESSION metadata --------------------------------------------------
  function parseSession(text) {
    var m = RE_SESSION.exec(text);
    if (!m) return null;
    var start = text.indexOf('{', m.index + m[0].length - 1);
    if (start < 0) return null;
    // The SESSION echo is one JSON object on a single line; find its end by brace balance.
    var depth = 0, inStr = false, esc = false, end = -1;
    for (var i = start; i < text.length; i++) {
      var c = text.charAt(i);
      if (inStr) {
        if (esc) esc = false;
        else if (c === '\\') esc = true;
        else if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') { inStr = true; continue; }
      if (c === '{') depth++;
      else if (c === '}') { depth--; if (depth === 0) { end = i; break; } }
    }
    if (end < 0) return null;
    try { return JSON.parse(text.slice(start, end + 1)); } catch (e) { return null; }
  }

  // Flatten the interesting bits of the SESSION echo into one settings object.
  function sessionSettings(session) {
    var s = {
      material: null, filamentDiameter: 1.75, zhopP: null, doZHop: null,
      minLayerTime: null, coolingWindow: null, travelSpeedXY: 500, travelSpeedZ: 10, areaX: 305, areaY: 305,
      inset0Speed: null, inset0EWMM: null, macroLayerHeight: null,
      seamDistributionPlastic: null, seamStartPlastic: null,
      retractOnLayerChange: null, retractOnlyWhenCrossing: null,
      retractLenOnTravel: null, retractSpeed: 20, retractMinTravelNoCrossing: null,
      retractMinTravelOnCrossing: null, startGCode: '', endGCode: '',
      fanSchedule: null, widths: {}, slicerSaysPlasticOnly: false,
      // Fortified = the fibre is part of the part's own perimeters from the
      // bottom up, so it must be laid down on layer 1. `CurrentSliceType` 2 is
      // the slicer's "Composite Only" mode and `MustGenerateFiberPerimeters`
      // is the matching profile switch; both are true only on the fortified
      // fixture in this corpus.
      currentSliceType: null, mustGenerateFiberPerimeters: null, fortified: false,
      closeFanFirstLayers: null, settingsSource: 'none',
      // Which profile key each value came from, so evidence strings name the
      // dialect's authority that actually fired.
      minLayerTimeSource: 'Profile.MinLayerTimeForSlowing',
      minLayerTimeKey: 'MinLayerTimeForSlowing',
      doZHopKey: 'DoZHop',
      coolingWindowSource: 'Profile.LayerTimeForMaxCooling'
    };
    if (!session) return s;
    s.settingsSource = 'session';
    var P = session.Profile || {};
    var PR = session.Printer || {};
    s.doZHop = P.DoZHop === undefined ? null : !!P.DoZHop;
    s.minLayerTime = P.MinLayerTimeForSlowing === undefined ? null : P.MinLayerTimeForSlowing;
    s.coolingWindow = P.LayerTimeForMaxCooling === undefined ? null : P.LayerTimeForMaxCooling;
    s.inset0Speed = P.Inset0Speed === undefined ? null : P.Inset0Speed;
    s.inset0EWMM = P.Inset0EWMM === undefined ? null : P.Inset0EWMM;
    s.macroLayerHeight = P.MacroLayerHeight === undefined ? null : P.MacroLayerHeight;
    s.seamDistributionPlastic = P.EnableAdjustSeamDistributionPositionPlastic === undefined
      ? null : !!P.EnableAdjustSeamDistributionPositionPlastic;
    s.seamStartPlastic = P.EnableAdjustSeamStartPositionPlastic === undefined
      ? null : !!P.EnableAdjustSeamStartPositionPlastic;
    s.retractOnLayerChange = P.DoRetractOnLayerChange === undefined ? null : !!P.DoRetractOnLayerChange;
    s.retractOnlyWhenCrossing = P.DoRetractOnlyWhenCrossingPerimeters === undefined
      ? null : !!P.DoRetractOnlyWhenCrossingPerimeters;
    s.startGCode = String(P.StartGCode || '') + '\n' + String(PR.StartGCode || '');
    s.endGCode = String(P.EndGCode || '') + '\n' + String(PR.EndGCode || '');
    s.fanSchedule = P.LayersAndFanSpeedsArray || null;
    s.currentSliceType = session.CurrentSliceType === undefined ? null : session.CurrentSliceType;
    s.mustGenerateFiberPerimeters = P.MustGenerateFiberPerimeters === undefined
      ? null : !!P.MustGenerateFiberPerimeters;
    s.fortified = s.currentSliceType === 2 || s.mustGenerateFiberPerimeters === true;
    s.travelSpeedXY = PR.TravelSpeedXY === undefined ? 500 : PR.TravelSpeedXY;
    s.travelSpeedZ = PR.TravelSpeedZ === undefined ? 10 : PR.TravelSpeedZ;
    s.areaX = PR.AreaSizeX === undefined ? 305 : PR.AreaSizeX;
    s.areaY = PR.AreaSizeY === undefined ? 305 : PR.AreaSizeY;

    var keys = Object.keys(session);
    for (var i = 0; i < keys.length; i++) {
      if (!/Slot$/.test(keys[i])) continue;
      var slot = session[keys[i]] || {};
      var mat = slot.Plastic || slot.Composite || null;
      if (mat) {
        if (mat.PlasticType) s.material = s.material || mat.PlasticType;

      if (role !== 'Custom') this.unknownTypes[role] = (this.unknownTypes[role] || 0) + 1;
      this.feature = null; this.featureName = null;
      return;
    }
    this.feature = f;
    this.featureName = role;
    this.stats.sections[role] = (this.stats.sections[role] || 0) + 1;
  };

  /*
   * Bead width for a feature entity. A width the slicer declared in its own
   * header outranks the tool's fallback table, because it is the file's own
   * statement of what it laid down. Rocket files emit no such lines, so this is
   * a no-op there and the Rocket corpus is unaffected.
   */
  Inspector.prototype.beadWidthFor = function (entityKey) {
    var w = this.headerWidths[entityKey];
    if (w > 0) return w;
    return D.beadWidth(this.settings, entityKey);
  };

  Inspector.prototype.onLayer = function (num, z) {
    if (this.layer >= 0 && this.layerStart) this.closeLayer();
    this.flushUnsupRun();
    this.layer = num;
    this.layerZ = z;
    this.layerLine = this.lineNo;
    this.layerTime = 0;
    this.layerExtrude = 0;
    this.layerMoves = 0;
    this.layerStart = { num: num, z: z, line: this.lineNo };
    if (this.raster) { this.raster.nextLayer(); this.raster.setZ(z); }
  };

  Inspector.prototype.closeLayer = function () {
    var t = this.layerTime;
    /*
     * Issue #5: the layer floor. The profile's own `MinLayerTimeForSlowing` is
     * the authority, but `Benchy_fortified.gcode` exports 0 — which does not
     * license a 0.13 s layer, it just means the slowdown pass was disabled. When
     * the profile is silent we fall back to the profile's cooling window
     * (`LayerTimeForMaxCooling`), and failing that to the tool floor, and say so
     * in the evidence so the reader knows which rule fired.
     */
    var prof = this.settings.minLayerTime;
    var min = prof, source = this.settings.minLayerTimeSource;
    if (!(min > 0)) {
      min = this.settings.coolingWindow > 0 ? this.settings.coolingWindow : this.minLayerTimeFloor;
      source = this.settings.coolingWindow > 0
        ? this.settings.coolingWindowSource + ' (' + this.settings.minLayerTimeKey + '=' + prof + ')'
        : 'tool floor (profile declares no minimum)';
    }
    this.layers.push({
      num: this.layerStart.num, z: this.layerStart.z, line: this.layerStart.line,
      time: t, moves: this.layerMoves, extrude: this.layerExtrude
    });
    this.stats.printTimeSec += t;
    if (t < this.stats.minLayerTime) {
      this.stats.minLayerTime = t;
      this.stats.minLayerTimeLayer = this.layerStart.num;
    }
    if (min > 0 && t < min) {
      var sev = t < min * 0.25 ? 'critical' : 'warning';
      this.add('C05', sev, this.layerStart.line, this.layer,
        'Layer ' + this.layerStart.num + ' time ' + t.toFixed(2) + 's is below the ' +
        min + 's floor (' + (prof > 0 ? 'profile minimum' : 'profile declares no minimum') + ')',
        source + '=' + min + ' measured=' + t.toFixed(2) + 's');
      this.worstSet('C05', min - t);
    }

    // Issue #3: voids enclosed by this layer's deposited material. A gap only
    // matters once it is wider than the bead that was supposed to close it.
    if (this.raster) {
      var width = this.beadWidthFor('INSET0');
      var v = this.raster.enclosedVoids(width * this.gapRatio);
      if (v.comps > 0) {
        this.stats.voidCells += v.total;
        this.stats.voidComps += v.comps;
        this.stats.voidWallComps += v.wallComps;
        this.stats.voidArea += v.area;
        if (v.widest > this.stats.voidWidest) this.stats.voidWidest = v.widest;
        if (v.widestWall > this.stats.voidWidestWall) this.stats.voidWidestWall = v.widestWall;
        for (var hb = 0; hb < v.hist.length; hb++) this.stats.voidHist[hb] += v.hist[hb];
        if (v.widestWall > 0) {
          this.stats.voidLayers++;
          var sev = v.widestWall >= width * this.gapCriticalRatio ? 'critical' : 'warning';
          this.add('C03', sev, this.layerStart.line, this.layer,
            'Layer ' + this.layerStart.num + ' encloses ' + v.wallComps + ' perimeter-bounded gap(s); ' +
            'widest \u2248 ' + v.widestWall.toFixed(2) + ' mm across (' + v.area.toFixed(1) +
            ' mm\u00b2 total) \u2014 wider than the ' + width.toFixed(2) + ' mm bead',
            'enclosed empty area inside the layer footprint bounded by a perimeter bead');
          this.worstSet('C03', v.widestWall);
        }
      }
      this.stats.voidSkipped += v.skipped;
    }
  };

  Inspector.prototype.onMotion = function (p) {
    var a = p.args;
    var x = a.X === undefined ? this.pos.x : a.X;
    var y = a.Y === undefined ? this.pos.y : a.Y;
    var z = a.Z === undefined ? this.pos.z : a.Z;
    var f = a.F === undefined ? this.pos.f : a.F;
    if (!(f > 0)) f = 6000;
    var d = D.extrusionDeltas(a, this.absE, this.lastE);
    var extruding = d.dE > 1e-9 || d.dU > 1e-9 || d.dV > 1e-9;
    var retracting = d.dE < -1e-9 || d.dV < -1e-9;
    var dx = x - this.pos.x, dy = y - this.pos.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var dz = z - this.pos.z;
    var axis = (a.E !== undefined) ? 'E' : ((a.U !== undefined || a.V !== undefined) ? 'UV' : null);
    var speed = f / 60;

    this.stats.moves++;
    this.layerMoves++;
    if (dist > 0) this.layerTime += dist / speed;
    else if (Math.abs(dz) > 0) this.layerTime += Math.abs(dz) / (this.settings.travelSpeedZ * 60);
    else if (retracting) this.layerTime += Math.abs(d.dE || d.dV) / (this.settings.retractSpeed || 20);
    else if (extruding) this.layerTime += (Math.max(0, d.dE) + Math.max(0, d.dV)) / speed;

    var feature = this.feature || { type: 'UNKNOWN', entity: 'UNKNOWN' };
    var width = this.beadWidthFor(feature.entity);
    var height = this.layerHeight();

    // ---- Z-hop bookkeeping (issue #29) ----
    if (!extruding && !retracting && Math.abs(dz) > 0.05) {
      this.zMoveLines.push(this.lineNo);
      if (dz > 0.05 && this.hopArmed) {
        this.pendingHop = { line: this.lineNo, dz: dz, z0: this.pos.z, z1: z, noRetract: !this.retracted };
      } else if (dz < -0.05 && this.pendingHop) {
        this.completeHop(z);
      }
    }

    if (extruding) {
      var b = this.stats.bbox;
      if (x < b.minx) b.minx = x;
      if (x > b.maxx) b.maxx = x;
      if (y < b.miny) b.miny = y;
      if (y > b.maxy) b.maxy = y;

      this.stats.extrudeMoves++;
      this.hopArmed = true;
      this.retracted = false;
      this.lastAxis = axis;
      this.prevWasExtrusion = true;
      if (axis === 'E') {
        this.stats.plasticMm += d.dE;
        this.stats.plasticVolMm3 += d.dE * Math.PI * Math.pow(this.settings.filamentDiameter / 2, 2);
      } else {
        if (a.U !== undefined) {
          var du = Math.max(0, d.dU);
          this.stats.fiberMoves++;
          if (du > 0) {
            this.stats.fiberMm += du;
            // Every positive U word is fibre that left the spool, whether or not
            // it reached the part. A U feed with no XY motion is the air prime
            // (`G1 F1200 U55 ; Extrude restart`) that pushes the 54.8 mm tail
            // through the path: real consumption, zero deposition.
            this.fiberFed += du;
            if (dist > 0) {
              this.fiberDeposited += du;
              if (this.firstFiberLayer === null) this.firstFiberLayer = this.layer;
              if (this.layer === 1) {
                var fn = this.featureName || '(unsectioned)';
                this.fiberOnLayer1[fn] = (this.fiberOnLayer1[fn] || 0) + du;
                if (!this.fiberLayer1First) {
                  this.fiberLayer1First = { line: this.lineNo, feature: fn, mm: du };
                }
              }
            } else {
              this.fiberRestart += du;
            }
          }
        }
        if (a.V !== undefined) this.stats.matrixMm += Math.max(0, d.dV);
      }
      this.layerExtrude += Math.max(0, d.dE) + Math.max(0, d.dV);
      this.pendingHop = null;

      // Checks that need the pre-move coverage state run *before* stamping.
      if (dist > 0) {
        this.onExtrusionMove(p, feature, width, height, dist, speed, d);
      }
      if (this.raster && dist > 0) this.raster.stamp(this.pos.x, this.pos.y, x, y, width, !!feature.wall);
    } else if (retracting) {
      this.retracted = true;
      this.stats.retractEvents++;
      this.retractLines.push(this.lineNo);
      this.prevWasExtrusion = false;
    } else if (dist > 0) {
      this.onTravel(p, dist, x, y);
      this.prevWasExtrusion = false;
      // A travel ends the printed path, so it ends any unsupported run.
      this.flushUnsupRun();
    }

    if (a.E !== undefined) this.lastE = this.absE ? a.E : this.lastE + a.E;
    this.pos.x = x; this.pos.y = y; this.pos.z = z; this.pos.f = f;
  };

  Inspector.prototype.layerHeight = function () {
    if (this.layers.length && this.layerZ > this.layers[this.layers.length - 1].z) {
      var h = this.layerZ - this.layers[this.layers.length - 1].z;
      if (h > 0.02 && h < 2) return h;
    }
    return this.settings.macroLayerHeight || 0.2;
  };

  /*
   * Issue #1 post-pass: resolve the tiered classification over the collected
   * population, then emit the individually reportable defects.
   *
   * Z-hop mitigation is a ±3-line window (the report's rule), which is why this
   * cannot run inline. The same pass finds the emission-ordering defect: a
   * retraction written 1–3 lines *after* an unprotected risk travel means the
   * nozzle already crossed the gap loaded.
   */
  Inspector.prototype.c01Pass = function () {
    var zs = this.zMoveLines, rl = this.retractLines;
    var nz = zs.length, nr = rl.length;
    function inWindow(arr, n, line, lo, hi) {
      // binary search for the first entry >= lo, then scan while <= hi
      var a = 0, b = n;
      while (a < b) { var m = (a + b) >> 1; if (arr[m] < lo) a = m + 1; else b = m; }
      for (var i = a; i < n && arr[i] <= hi; i++) if (arr[i] >= lo) return true;
      return false;
    }
    var worst = 0, worstLine = 0;
    for (var i = 0; i < this.riskTravels.length; i++) {
      var t = this.riskTravels[i];
      var hop = inWindow(zs, nz, t.line, t.line - 3, t.line + 3);
      t.hop = hop;
      this.riskClass[t.cls]++;
      if (hop) this.riskZhop[t.cls]++;
      if (t.cls === 'solid') continue;
      this.riskDefects++;
      if (!hop) {
        this.unmitigated++;
        if (t.dist > worst) { worst = t.dist; worstLine = t.line; }
        if (t.dist >= this.minTravel) {
          var sev = t.dist >= 20 ? 'critical' : (t.dist >= 8 ? 'warning' : 'info');
          this.add('C01', sev, t.line, t.layer,
            'Un-retracted plastic travel ' + (t.cls === 'air' ? 'over open air' : 'across void') +
            ' of ' + t.dist.toFixed(1) + ' mm (stringing risk)',
            t.code + ' at line ' + t.line + ' \u2014 no retraction, no Z-hop' +
            (t.feat ? ', ' + t.feat : ''));
          this.worstSet('C01', t.dist);
        }
        // Retraction written *after* the move: emitter ordering defect.
        if (inWindow(rl, nr, t.line, t.line + 1, t.line + 3)) {
          this.orderDefects++;
          if (this.orderDefects <= 40) {
            this.add('C01', 'warning', t.line, t.layer,
              'Retraction emitted AFTER the travel move (emitter ordering defect)',
              'travel at line ' + t.line + ' (' + t.dist.toFixed(1) + ' mm, ' + t.cls +
              ') is followed by a retraction within 3 lines');
          }
        }
      }
    }
    this.riskZhopTotal = this.riskZhop.solid + this.riskZhop.void + this.riskZhop.air;
    this.riskWorst = worst;
    this.riskWorstLine = worstLine;
  };

  Inspector.prototype.completeHop = function (zBack) {
    var h = this.pendingHop;
    this.pendingHop = null;
    if (!h) return;
    if (Math.abs(zBack - h.z0) > 0.05) return;   // not a return-to-height hop
    if (h.dz > 2) return;                        // tool-change / clearance lift
    if (this.inToolChange) return;
    if (this.lastAxis !== 'E') return;           // plastic travel hops only
    this.hopCount++;
    if (h.noRetract) this.hopNoRetract++;
    if (this.settings.doZHop === false) {
      this.hopCountDisabled++;
      if (!this.hopDisabledFirst) {
        this.hopDisabledFirst = {
          line: h.line, layer: this.layer, dz: h.dz,
          z0: h.z0, z1: h.z1, z2: zBack, noRetract: h.noRetract
        };
      }
    }
  };

  /*
   * Issue #1 — the stringing-risk population.
   *
   * The report defines the population as plastic travels that *immediately*
   * follow a plastic extrusion with no retraction between them, then tiers the
   * result by what each path crosses. We use that definition with two
   * documented refinements:
   *
   *   - Support sections are excluded. Support is broken away and its travel is
   *     wiped by design; counting it inflates the total with moves nobody would
   *     call a stringing defect (20% of L1's travels).
   *   - Travels shorter than `minTravel` are tiered but not reported
   *     individually: a 0.3 mm hop between collinear wall segments cannot
   *     strand a visible thread.
   *
   * Z-hop mitigation uses the report's own window: a Z move greater than 0.05 mm
   * within three G-code lines before or after the travel. Because that window
   * extends forwards, classification is resolved in `c01Pass()` after the scan.
   */
  Inspector.prototype.onTravel = function (p, dist, x, y) {
    this.stats.travelMoves++;
    var cls = this.raster ? this.raster.classifyTravel(this.pos.x, this.pos.y, x, y) : 'solid';
    this.travelClass[cls]++;
    if (!this.retracted && this.lastAxis === 'E') this.unretractedTravels++;

    var immediate = this.prevWasExtrusion && this.lastAxis === 'E';
    var inSupport = this.feature && this.feature.type === 'SUPPORT';

    if (immediate) {
      this.unretractedImmediate++;
      if (!inSupport) {
        this.riskTravels.push({
          line: this.lineNo, layer: this.layer, dist: dist, cls: cls,
          code: p.code, feat: this.featureName
        });
      }
    }
    this.lastTravel = { line: this.lineNo, dist: dist, cls: cls };
  };

  Inspector.prototype.onExtrusionMove = function (p, feature, width, height, dist, speed, d) {
    // --- volumetric flow (issue #4) ---
    var ceiling = GENERIC_CEILING[this.settings.material] || 12;
    var feedMm3 = 0;
    if (feature.type === 'FIBER' || d.dU > 0) {
      // Fiber moves carry no E word; the melt demand is the matrix (V) feed.
      var dV = Math.max(0, d.dV);
      if (dV > 0) feedMm3 = (dV / dist) * Math.PI * Math.pow(this.settings.filamentDiameter / 2, 2) * speed;
    } else {
      feedMm3 = (d.dE / dist) * width * height * speed;
    }
    if (feedMm3 > this.stats.maxFlow) { this.stats.maxFlow = feedMm3; this.stats.maxFlowLine = this.lineNo; }

    if (feedMm3 > ceiling) {
      var dt = dist / speed;
      this.sustained.t += dt;
      this.sustained.v += feedMm3 * dt;
      if (this.sustained.t >= this.sustainedWindow) {
        var avg = this.sustained.v / this.sustained.t;
        this.sustained.t = 0; this.sustained.v = 0;
        if (avg > ceiling) {
          var sev = avg >= ceiling * this.flowCritical ? 'critical' : 'warning';
          this.add('C04', sev, this.lineNo, this.layer,
            'Sustained volumetric demand ' + avg.toFixed(1) + ' mm\u00b3/s against a ' +
            ceiling + ' mm\u00b3/s ' + (this.settings.material || 'generic') + ' ceiling',
            p.code + ' F' + (p.args.F || Math.round(this.pos.f)) + ' \u2014 ' + feature.type +
            ', ' + width + 'x' + height.toFixed(2) + ' mm bead');
          this.worstSet('C04', avg);
        }
      }
    } else {
      this.sustained.t = 0; this.sustained.v = 0;
    }

    // --- unsupported runs (issue #6) ---
    //
    // A run is one *contiguous printed path*: it accumulates while the nozzle
    // keeps extruding without support and ends at the first supported segment,
    // travel, feature change or layer change. Reporting the *completed* length
    // (not the length at the moment the threshold is crossed) is what makes the
    // magnitudes comparable to issue #6, which quotes whole-run lengths.
    //
    // A closed loop laid over open space counts its whole perimeter — the
    // report's own convention, "16 mm unsupported runs" for a 17.5 x 13 mm
    // rectangle — while two separate bridges do not add up. Plastic only: fiber
    // deposition has its own mechanics.
    var skip = feature.type === 'SUPPORT' || feature.type === 'SKIRT' ||
               feature.type === 'BRIM' || feature.type === 'PRIMING' ||
               feature.type === 'WIPE';
    if (this.raster && this.layer > 1 && !skip && d.dE > 0 &&
        p.args.X !== undefined && p.args.Y !== undefined) {
      if (this.segmentUnsupported(this.pos.x, this.pos.y, p.args.X, p.args.Y,
                                  this.supportRadius, this.supportDepth)) {
        if (this.unsupRun === 0) {
          this.unsupStartLine = this.lineNo;
          this.unsupStartLayer = this.layer;
          this.unsupFeature = feature.type;
          this.unsupFanAtStart = this.partFan() > 0;
          this.unsupFeed = this.pos.f;
        }
        this.unsupRun += dist;
        if (this.unsupRun > this.unsupMax) this.unsupMax = this.unsupRun;
        if (!this.unsupFanAtStart) this.unsupFanOff += dist;
      } else {
        this.flushUnsupRun();
      }
    } else if (skip) {
      // Switching into support/skirt/brim/priming/wipe plastic interrupts the
      // printed path being measured, so it ends the run.
      this.flushUnsupRun();
    }
  };

  /*
   * Close the current unsupported run and raise the finding if it reached the
   * issue #6 floor. Called when the run is broken by supported plastic, a
   * travel, a feature change or a layer change.
   */
  Inspector.prototype.flushUnsupRun = function () {
    var len = this.unsupRun;
    if (len >= this.minUnsupported) {
      this.unsupRuns++;
      this.add('C06', len >= 40 ? 'critical' : 'warning', this.unsupStartLine, this.unsupStartLayer,
        'Unsupported printed run of ' + len.toFixed(1) + ' mm' +
        (this.unsupFanAtStart ? '' : ' with the part fan off'),
        this.unsupFeature + ' section at F' + Math.round(this.unsupFeed) +
        (this.unsupFanAtStart ? ', fan on' : ', part fan off'));
      this.worstSet('C06', len);
    }
    this.unsupRun = 0;
    this.unsupReported = false;
  };

  Inspector.prototype.segmentUnsupported = function (x0, y0, x1, y1, radius, depth) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len === 0) return false;
    var n = Math.max(1, Math.ceil(len / 0.5)), bad = 0;
    for (var i = 0; i <= n; i++) {
      var t = i / n;
      if (!this.raster.supported(x0 + dx * t, y0 + dy * t, radius, depth)) bad++;
    }
    return bad / (n + 1) > 0.9;
  };

  Inspector.prototype.finish = function () {
    if (this.layerStart) this.closeLayer();
    if (this.m1001Open > 0) {
      this.add('C08', 'warning', 0, null,
        this.m1001Open + ' M1001 fiber window(s) never closed by M1002', '');
    }
    if (this.m1001 > 0) {
      this.add('C08', 'critical', 0, null,
        this.m1001 + ' \u00d7 M1001 / ' + this.m1002 + ' \u00d7 M1002 emitted \u2014 no firmware handler exists (issue #9)',
        'fiber-feed windows bracketed by unimplemented commands' +
        (this.m1001NoL ? '; ' + this.m1001NoL + ' M1001 without an L parameter' : ''));
    }
  };

  // ---- derived checks, after the pass ------------------------------------
  Inspector.prototype.postChecks = function () {
    var s = this.settings;

    // C01 tiered travel classification (issue #1)
    this.c01Pass();

    // C10 Z-hop against the exported setting (issue #29). One finding per file:
    // the defect is the disagreement itself, and the count is the magnitude.
    if (this.hopCountDisabled > 0) {
      var f10 = this.hopDisabledFirst;
      // Rocket keeps its original wording; a flat-config file names the key it
      // actually read, since `Profile.DoZHop` does not exist in that dialect.
      var hopSetting = s.settingsSource === 'session'
        ? 'Profile.DoZHop=false' : s.doZHopKey + '=off';
      var hopHeightLabel = s.settingsSource === 'session' ? 'ZhopP=' : 'hop height ';
      this.add('C10', 'critical', f10.line, f10.layer,
        this.hopCountDisabled + ' plastic travel Z-hops of ' + f10.dz.toFixed(2) +
        ' mm emitted while ' + hopSetting,
        'first at line ' + f10.line + ': Z' + f10.z0.toFixed(3) + ' \u2192 Z' + f10.z1.toFixed(3) +
        ' \u2192 Z' + f10.z2.toFixed(3) + ' (' + hopHeightLabel + this.settings.zhopP +
        (f10.noRetract ? ', no preceding retraction' : '') + ')');
      this.worstSet('C10', this.hopCountDisabled);
    }

    // C07 motion contract (issue #8)
    /*
     * Issue #8 is about Rocket Slicer leaning on firmware defaults. On a Klipper
     * target the contract is declared with `SET_VELOCITY_LIMIT`, not with Marlin
     * verbs, so demanding M204/M205/M203 there is a dialect assumption rather
     * than a finding. Suppression is keyed on a line that actually declares the
     * acceleration limit (`ACCEL=`), the M204 analogue: Rocket's own
     * `SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO=0.8` declares no acceleration, so
     * Rocket files keep the findings they have always raised.
     */
    var klipperContract = this.klipperAccelLine > 0;
    if (klipperContract) {
      this.add('C07', 'info', this.klipperAccelLine, null,
        'Motion contract declared in Klipper form (SET_VELOCITY_LIMIT with ACCEL) \u2014 ' +
        'M204/M205/M203 are not the mechanism on this target',
        'SET_VELOCITY_LIMIT at line ' + this.klipperAccelLine + ' replaces the Marlin verbs');
    }
    if (this.m204 === null && !klipperContract) {
      this.add('C07', 'warning', 0, null, 'No M204 acceleration command anywhere in the file', '');
    } else if (this.m204 !== null && this.m204.line > 200) {
      this.add('C07', 'warning', this.m204.line, null,
        'First M204 (acceleration regime) appears at line ' + this.m204.line +
        ' \u2014 past the header/preamble, so generic tools parse default values',
        'M204 S' + this.m204.value);
    }
    if (this.m205 === 0 && !klipperContract) {
      this.add('C07', 'warning', 0, null, 'No M205 (jerk) command in the file', '');
    }
    if (this.m203 === 0 && !klipperContract) {
      this.add('C07', 'warning', 0, null, 'No M203 (max feedrate) command in the file', '');
    }
    if (/SET_VELOCITY_LIMIT|SET_PRESSURE_ADVANCE/.test(s.startGCode) && this.klipperMotionLines === 0) {
      this.add('C07', 'warning', 0, null,
        'Klipper motion limits (SET_VELOCITY_LIMIT / SET_PRESSURE_ADVANCE) exist only as a header echo, not as executable lines',
        'profile StartGCode contains them but no such command was emitted');
    }

    // C04 header-derived nominal wall flow (issue #4 corroboration)
    if (s.inset0Speed && s.inset0EWMM) {
      var ceiling = GENERIC_CEILING[s.material] || 12;
      var nominal = s.inset0EWMM * (s.macroLayerHeight || 0.2) * s.inset0Speed;

          'Header Inset0Speed=' + s.inset0Speed + ' mm/s on a ' + s.inset0EWMM + ' \u00d7 ' +
          (s.macroLayerHeight || 0.2) + ' mm bead = ' + nominal.toFixed(1) +
          ' mm\u00b3/s constant wall demand vs a ' + ceiling + ' mm\u00b3/s ' +
          (s.material || 'generic') + ' ceiling',
          'Inset0Speed / Inset0EWMM / MacroLayerHeight from the SESSION echo');

        sc.x.toFixed(3) + ' Y' + sc.y.toFixed(3),
        'EnableAdjustSeamDistributionPositionPlastic=' + s.seamDistributionPlastic);

          'CASE_FAN used ' + this.customVerbs[v] + ' time(s) but is not defined in the firmware contract (issue #11)', '');
      } else {
        this.add('C09', 'warning', 0, null,
          'Undefined command ' + v + ' used ' + this.customVerbs[v] +

          'Deposited geometry leaves the declared build area ' + s.areaX + '\u00d7' + s.areaY,
          'bbox X ' + b.minx.toFixed(1) + '\u2013' + b.maxx.toFixed(1) +

      this.add('C11', 'critical', 0, null, 'No extrusion moves found \u2014 file did not parse as G-code', '');
    }
    if (this.header.layerCount && this.layers.length && this.header.layerCount !== this.layers.length) {
      this.add('C11', 'warning', 0, null,
        'Header LAYER_COUNT=' + this.header.layerCount + ' but ' + this.layers.length +
        ' ; LAYER: markers parsed', 'layer markers are the authority (GCODE_REFERENCE \u00a74)');

      this.add('C11', 'critical', 0, null,
        'No ; LAYER: markers parsed \u2014 layer detection must tolerate the space after ";"', '');

    // attributed to no feature: every geometry-dependent rule reads the label.

      unknownTypes.sort(function (a, b) { return this.unknownTypes[b] - this.unknownTypes[a]; }.bind(this));

        'Unrecognised ;TYPE: role(s) \u2014 geometry in them is attributed to no feature: ' +
        unknownTypes.slice(0, 5).map(function (k) {
          return k + ' (' + this.unknownTypes[k] + ')';
        }, this).join(', '),
        'extend Dialect.TYPE_FEATURES');
    }

    this.c12Check();

    this.c14Check();

  };

  /*
   * C12 — carbon on the first layer.
   *
   * Owner rule (2026-10-03): "unless it's a fortified print, carbon should not
   * be the first layer". Fortified means the fibre *is* the part's own skin, so
   * it has to start at layer 1; everywhere else a first-layer fibre deposit is
   * a process defect — carbon at the bed interface gives poor adhesion and a
   * rough bottom face.
   *
   * The distinction that matters is structural vs sacrificial. A `Priming line`
   * or `Skirt`/`Brim`/`Wipe tower` fibre pass on layer 1 is the documented
   * head-loading dance: it is on the bed, but it is not the part's first layer.
   * Those are reported as info, not as violations. Fibre inside a wall or
   * infill feature on layer 1 of a non-fortified print is the violation.
   */

      fortified: !!this.settings.fortified,

      firstLine: null, violation: false, verdict: 'none'

    if (!feats.length) {
      this.add('C12', 'info', 0, 1, 'No fibre on layer 1 \u2014 first layer is plastic-only',
        'first fibre layer ' + (this.firstFiberLayer === null ? 'none' : this.firstFiberLayer));
      return;
    }
    var SACRIFICIAL = { SKIRT: 1, BRIM: 1, PRIMING: 1, WIPE: 1 };
    var structural = [], sacrificial = [];
    var sMm = 0, xMm = 0;
    feats.forEach(function (f) {
      var type = D.FEATURES[f] ? D.FEATURES[f].type : 'UNKNOWN';
      var mm = this.fiberOnLayer1[f];
      if (SACRIFICIAL[type]) { sacrificial.push(f + ' ' + mm.toFixed(1)); sMm += mm; }
      else { structural.push(f + ' ' + mm.toFixed(1)); xMm += mm; }
    }, this);
    function names(arr) { return arr.map(function (s) { return s.replace(/ [\d.]+$/, ''); }); }

    this.c12 = {
      fortified: !!this.settings.fortified,
      structuralMm: xMm, sacrificialMm: sMm,
      structural: names(structural), sacrificial: names(sacrificial),
      firstLine: this.fiberLayer1First ? this.fiberLayer1First.line : null,
      violation: violation,
      // One verdict string shared by CLI, browser and report so the three can
      // never disagree. Precedence matters: a fortified *configuration* with no
      // structural fibre on layer 1 (Benchy_renforced_level5-pla) is not
      // "fortified fibre on L1" — it is simply a plastic first layer.
      verdict: violation ? 'violation'
        : (this.settings.fortified && xMm > 0) ? 'permitted-fortified'
        : 'sacrificial-only'
    };

    if (this.settings.fortified) {
      this.add('C12', 'info', this.fiberLayer1First.line, 1,
        'Fibre on layer 1 (' + xMm.toFixed(1) + ' mm deposited) \u2014 permitted: this is a fortified print',
        'CurrentSliceType=' + this.settings.currentSliceType +
        ' MustGenerateFiberPerimeters=' + this.settings.mustGenerateFiberPerimeters +
        '; ' + (structural.concat(sacrificial).join(', ') || 'none'));
      return;
    }
    if (structural.length) {
      this.add('C12', 'critical', this.fiberLayer1First.line, 1,
        xMm.toFixed(1) + ' mm of fibre deposited in part geometry on layer 1 of a non-fortified print',
        'features: ' + structural.join(', ') + '; first fibre move at line ' +
        this.fiberLayer1First.line + ' (' + this.fiberLayer1First.feature + ')' +
        (sacrificial.length ? '; also sacrificial: ' + sacrificial.join(', ') : '') +
        '; CurrentSliceType=' + this.settings.currentSliceType +
        ' MustGenerateFiberPerimeters=' + this.settings.mustGenerateFiberPerimeters);
      this.worstSet('C12', xMm);
    } else {
      this.add('C12', 'info', this.fiberLayer1First.line, 1,
        'Fibre on layer 1 is confined to the sacrificial priming/skirt pass (' +
        sMm.toFixed(1) + ' mm) \u2014 the part\u2019s first layer is plastic',
        sacrificial.join(', ') + '; first fibre move at line ' + this.fiberLayer1First.line);
    }
  };

  /*
   * C13 — dual-tool or single-tool?
   *
   * Three independent signals, reported together because they do not always
   * agree: the `; PRINTING_MODE:` header, the `T0`/`T1` commands actually
   * issued, and which extrusion axis (E vs U) actually deposited material.
   * `Benchy_fortified.gcode` is the instructive case: the header says
   * "Composite Only" yet the file issues 136 `T1` changes and deposits 2.87 m
   * of plastic, because the tool-change dance and the plastic wet-out matrix

      'Tool configuration: ' + label + ' \u2014 T0\u00d7' + this.t0 + ' / T1\u00d7' + this.t1 +

      (this.fiberFed / 1000).toFixed(2) + ' m fed',

    if (declared && declared !== observed && !(declared === 'fiber-only' && observed === 'dual')) {
      this.add('C13', 'warning', 0, null,
        'Header ; PRINTING_MODE: "' + mode + '" declares ' + declared +
        ' but the file deposits ' + observed,
        'T0\u00d7' + this.t0 + ' T1\u00d7' + this.t1 + ' \u00b7 plastic ' +
        (this.stats.plasticMm / 1000).toFixed(2) + ' m \u00b7 fibre ' +
        (this.fiberFed / 1000).toFixed(2) + ' m');

    // dialect quirk, not a defect: report it as info so the reader is not
    // misled by the header alone.

        'Header says "Composite Only" but the plastic tool is used \u2014 the fibre wet-out matrix and tool-change dance still drive T1',

          this.cuts + ' M2800 cut(s) issued on a print that never fed fibre', '');

    this.add('C14', 'info', 0, null,
      'Fibre: ' + (fed / 1000).toFixed(2) + ' m fed \u2014 ' + (dep / 1000).toFixed(2) +
      ' m deposited in the part, ' + (rst / 1000).toFixed(2) + ' m (' +
      (100 * rst / fed).toFixed(0) + ' %) air-primed through the head' +
      (declaredM !== null ? '; slicer declares ' + declaredM.toFixed(2) + ' m' : ''),
      'fed=\u03a3U, deposited=\u03a3U on moves with XY motion, restart=\u03a3U with no XY motion' +
      (declaredM !== null ? '; MATERIAL_PRINT_DATA tow Length=' + declaredM.toFixed(6) + ' m' : ''));

      this.cuts + ' fibre cut(s) (M2800)' +
      (this.cutDistLast !== null ? ', tail constant ' + this.cutDistLast.toFixed(1) + ' mm' : '') +
      (this.cuts ? ' \u2014 ' + (this.cutDistMm / 1000).toFixed(2) + ' m of trimmed tail' : ''),
      'M2800 count; ;CUT DISTANCE sum ' + this.cutDistMm.toFixed(0) + ' mm' +
      (this.cutDistOrphan ? '; ' + this.cutDistOrphan + ' ;CUT DISTANCE comment(s) with no preceding M2800 (end-gcode echo)' : ''));

    if (declaredM !== null) {

          'Measured fibre deposition ' + (dep / 1000).toFixed(2) + ' m disagrees with the slicer\u2019s declared ' +
          declaredM.toFixed(2) + ' m by ' + diff.toFixed(2) + ' m',
          'expected \u03a3U(XY) == MATERIAL_PRINT_DATA tow Length');

        ' cut(s) issued \u2014 a segment ended uncut',
        'every fibre segment must close with M2800 (Exploration/FibreUsage.md \u00a75.7)');

  /*
   * C15 — machine-assist flags.
   *
   * The machine has AI/spaghetti detection, a piezo bed-mesh front end,
   * resonance testing and filament runout sensors (Exploration/HardwareInfo.md;
   * ERROR_CODES.md 10072\u201310074 and the 30000-series). None of them are exported
   * in the SESSION echo \u2014 the exported profile vocabulary is slicing geometry

        present.length + ' of ' + D.MACHINE_FLAGS.length + ' machine-assist flags present: ' +

        'No machine-assist flag present \u2014 none of the ' + D.MACHINE_FLAGS.length +
        ' recognised commands appear as executable lines',

        '; absence means not requested by this file, not unconfigured on the machine' +

  Inspector.prototype.seamClusters = function () {
    if (!this.seams.length) return { run: 0, clusters: 0, x: 0, y: 0, layer: 0, line: 0 };
    var byXY = {};
    for (var i = 0; i < this.seams.length; i++) {

    Object.keys(byXY).forEach(function (k) {
      var arr = byXY[k].slice().sort(function (a, b) { return a.layer - b.layer; });

      byCheck[c] = {

        count: this.counts[c] || 0,

        worst: this.worst[c] === undefined ? null : this.worst[c]

      header: this.header,
      settings: {

        material: s.material, doZHop: s.doZHop, zhopP: s.zhopP, minLayerTime: s.minLayerTime,
        doZHopKey: s.doZHopKey, minLayerTimeKey: s.minLayerTimeKey,

        seamDistributionPlastic: s.seamDistributionPlastic,

  }
  function issueLink(n) {
    return n ? '<a href="https://github.com/3ricj/FibreSeeker3/issues/' + n + '" target="_blank" rel="noopener">#' + n + '</a>' : '\u2014';
  }

  $('files').addEventListener('change', function (e) { addFiles(e.target.files); });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });

  function addFiles(list) {
    for (var i = 0; i < list.length; i++) {
      if (/\.gcode|\.gco|\.g$|\.txt$/i.test(list[i].name)) files.push(list[i]);
    }
    if (!files.length) return;
    $('run').disabled = false;
    $('status').textContent = files.length + ' file(s) staged';
    run();
  }

  $('run').addEventListener('click', run);

  function opts() {
    return {
      cell: parseFloat($('cell').value) || 0.2,
      coverage: $('coverage').checked,
      maxFindings: 4000,
      gapRatio: parseFloat($('gapRatio').value) || 1.5,
      minUnsupported: parseFloat($('minUnsup').value) || 16,
      minSeamRun: parseInt($('minSeam').value, 10) || 10
    };
  }

  function run() {
    if (!files.length) return;
    $('status').textContent = 'inspecting\u2026';
    // Yield once so the status line paints before the (synchronous) scan.
    setTimeout(function () {
      var o = opts();
      reports = [];
      var t0 = performance.now();
      var done = 0;
      function step() {
        var f = files[done];
        var fr = new FileReader();
        fr.onload = function () {
          var ins = new FS3.Inspector(o);
          try { reports.push(ins.run(String(fr.result), f.name)); }
          catch (e) { console.error(f.name, e); }
          done++;
          if (done < files.length) { step(); }
          else {
            $('status').textContent = reports.length + ' file(s) in ' +
              ((performance.now() - t0) / 1000).toFixed(1) + ' s';
            render();
          }
        };
        fr.onerror = function () { done++; if (done < files.length) step(); else render(); };
        fr.readAsText(f);
      }
      step();
    }, 20);
  }

  function totals(key) {
    var t = { count: 0, critical: 0, worst: null };
    reports.forEach(function (r) {
      var b = r.byCheck[key];
      t.count += b.count; t.critical += b.critical;
      if (b.worst !== null && (t.worst === null || b.worst > t.worst)) t.worst = b.worst;
    });
    return t;
  }

  function render() {
    var h = '';
    // ---- headline cards ----
    var risk = reports.reduce(function (a, r) { return a + r.stats.riskDefects; }, 0);
    var unmit = reports.reduce(function (a, r) { return a + r.stats.unmitigatedTravels; }, 0);
    var gaps = reports.reduce(function (a, r) { return a + r.stats.voidWallComps; }, 0);
    var unsup = reports.reduce(function (a, r) { return a + r.stats.unsupportedRuns; }, 0);
    var hops = reports.reduce(function (a, r) { return a + r.stats.zhopHopsAgainstSetting; }, 0);
    var crit = reports.reduce(function (a, r) {
      return a + ORDER.reduce(function (k, c) { return k + r.byCheck[c].critical; }, 0);
    }, 0);
    h += '<div class="grid">' +
      card('Critical findings', crit) +
      card('Stringing-risk travels', risk) +
      card('\u2026with no mitigation', unmit) +
      card('Perimeter gaps', gaps) +
      card('Unsupported runs', unsup) +
      card('Z-hops vs DoZHop=false', hops) +
      '</div>';

    // ---- the print contract: the four questions asked of every file ----
    h += '<h2>Print contract</h2>';
    h += '<div style="overflow:auto"><table><thead><tr><th>File</th>' +
      '<th>Carbon on layer 1</th><th>Tool configuration</th>' +
      '<th class="n">Fibre fed / in part</th><th class="n">Cuts</th><th>Machine flags</th></tr></thead><tbody>';
    reports.forEach(function (r) {
      var s = r.stats, c12 = s.firstLayerFiber || {}, t = s.tools || {}, fb = s.fiber || {}, mf = s.machineFlags || {};
      var l1 = !Object.keys(s.fiberOnLayer1 || {}).length
        ? '<span class="muted">none \u2014 plastic first layer</span>'
        : c12.verdict === 'violation'
          ? '<span class="sev critical">VIOLATION</span> <span class="mono">' + fmt(c12.structuralMm, 1) + ' mm in ' + esc(c12.structural.join(', ')) + '</span>'
          : c12.verdict === 'permitted-fortified'
            ? '<span class="sev info">OK \u2014 fortified</span> <span class="mono">' + fmt(c12.structuralMm, 1) + ' mm</span>'
            : '<span class="sev info">OK</span> <span class="muted">priming/skirt only, ' + fmt(c12.sacrificialMm, 1) + ' mm</span>';
      var tool = t.observed === 'dual' ? '<b>dual-tool</b> <span class="muted">FFF + CFC</span>'
        : t.observed === 'fiber-only' ? '<b>fibre-only</b> <span class="muted">CFC tool</span>'
        : t.observed === 'plastic-only' ? '<b>single-tool FFF</b>'
        : '<span class="muted">\u2014</span>';
      var contra = t.declared && t.declared !== t.observed
        ? '<br><span class="muted mono">header "' + esc(t.mode || '') + '" says ' + esc(t.declared) + '</span>' : '';
      var flags = mf.present && mf.present.length
        ? '<span class="sev info">' + mf.present.length + ' present</span> <span class="mono">' +
          esc(mf.present.map(function (p) { return p.label; }).join(', ')) + '</span>'
        : '<span class="muted">none of ' + ((mf.absent || []).length) + ' \u2014 all absent</span>';
      h += '<tr><td><b>' + esc(r.file) + '</b></td><td>' + l1 + '</td><td>' + tool + contra + '</td>' +
        '<td class="n mono">' + fmt((fb.fedMm || 0) / 1000, 2) + ' m / ' + fmt((fb.depositedMm || 0) / 1000, 2) + ' m</td>' +
        '<td class="n">' + fmt(fb.cuts) + '</td><td>' + flags + '</td></tr>';
    });
    h += '</tbody></table></div>';

    // ---- per-file matrix ----
    h += '<h2>Per-file results</h2><div style="overflow:auto"><table><thead><tr>' +
      '<th>File</th><th class="n">Layers</th><th class="n">Moves</th>';
    ORDER.forEach(function (c) { h += '<th class="n">' + c + '</th>'; });
    h += '<th class="n">Total</th></tr></thead><tbody>';
    reports.forEach(function (r, ix) {
      var s = r.stats, tot = ORDER.reduce(function (a, c) { return a + r.byCheck[c].count; }, 0);
      h += '<tr class="row" data-f="' + ix + '"><td><b>' + esc(r.file) + '</b><br><span class="muted mono">' +
        esc(s.material || '?') + ' \u00b7 DoZHop=' + s.doZHop + ' \u00b7 ' + fmt(s.lines) + ' lines</span></td>' +
        '<td class="n">' + fmt(s.layers) + '</td><td class="n">' + fmt(s.moves) + '</td>';
      ORDER.forEach(function (c) {
        var b = r.byCheck[c];
        h += '<td class="n">' + (b.count ? '<span class="sev ' + (b.critical ? 'critical' : 'warning') + '">' + fmt(b.count) + '</span>' : '<span class="muted">0</span>') + '</td>';
      });
      h += '<td class="n"><b>' + fmt(tot) + '</b></td></tr>';
    });
    h += '</tbody></table></div>';

    // ---- aggregate by check ----
    h += '<h2>Checks and what they found</h2><div style="overflow:auto"><table><thead><tr>' +
      '<th>Check</th><th>Issue</th><th>What it looks for</th><th class="n">Findings</th><th class="n">Critical</th><th>Worst measured</th></tr></thead><tbody>';
    ORDER.forEach(function (c) {
      var t = totals(c), ck = FS3.CHECKS[c];
      h += '<tr><td><b>' + c + '</b></td><td>' + issueLink(ck.issue) + '</td><td>' + esc(ck.title) + '</td>' +
        '<td class="n">' + fmt(t.count) + '</td><td class="n">' + fmt(t.critical) + '</td>' +
        '<td class="mono">' + (t.worst === null ? '\u2014' : fmt(t.worst, 2)) + '</td></tr>';
    });
    h += '</tbody></table></div>';

    // ---- per-file detail ----
    reports.forEach(function (r, ix) {
      h += '<details data-d="' + ix + '"><summary>' + esc(r.file) +
        ' <span class="muted">\u2014 ' + fmt(r.stats.layers) + ' layers, ' +
        fmt(ORDER.reduce(function (a, c) { return a + r.byCheck[c].count; }, 0)) + ' findings</span></summary>';
      h += '<div class="split"><div>';
      ORDER.forEach(function (c) {
        var list = r.findings.filter(function (f) { return f.check === c; });
        if (!list.length) return;
        list.sort(function (a, b) {
          var d = sevOrder(a.severity) - sevOrder(b.severity);
          return d ? d : a.line - b.line;
        });
        h += '<h4>' + c + ' \u2014 ' + esc(FS3.CHECKS[c].title) + ' (' + list.length + ')</h4>';
        h += '<div class="findings"><table><tbody>';
        list.slice(0, 400).forEach(function (f) {
          h += '<tr><td class="mono">' + fmt(f.line) + (f.layer === null || f.layer === undefined ? '' : ':' + f.layer) +
            '</td><td class="sev ' + f.severity + '">' + f.severity + '</td><td>' + esc(f.message) +
            (f.evidence ? ' <span class="muted mono">' + esc(f.evidence) + '</span>' : '') + '</td></tr>';
        });
        h += '</tbody></table></div>';
        if (list.length > 400) h += '<div class="muted">\u2026 ' + fmt(list.length - 400) + ' more (see Export JSON)</div>';
      });
      h += '</div><div>';
      h += '<h4>Print contract</h4><div class="kv">' + contract(r) + '</div>';
      h += '<h4>File facts</h4><div class="kv">' + kv(r) + '</div>';
      if (r.stats.voidComps) {
        h += '<h4>Gap width histogram (count per 0.25 mm)</h4><div class="hist">';
        var mx = Math.max.apply(null, r.stats.voidHist) || 1;
        r.stats.voidHist.forEach(function (v, i) {
          h += '<div title="' + ((i * 0.25).toFixed(2)) + ' mm: ' + v + '" style="height:' +
            Math.max(2, Math.round(v / mx * 70)) + 'px"></div>';
        });
        h += '</div>';
      }
      h += '<h4>Layer times</h4><div class="muted">min ' + fmt(r.stats.minLayerTime, 2) +
        ' s at layer ' + (r.stats.minLayerTimeLayer === null ? '\u2014' : r.stats.minLayerTimeLayer) +
        ' \u00b7 estimated print ' + fmt(r.stats.estPrintTimeSec / 60, 1) + ' min</div>';
      h += '</div></div></details>';
    });
    out.innerHTML = h;
  }

  function sevOrder(s) { return s === 'critical' ? 0 : s === 'warning' ? 1 : 2; }

  function card(lbl, n) {
    return '<div class="card"><div class="num">' + fmt(n) + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  /*
   * The four print-contract answers, rendered from the C12-C15 stats rather than
   * from the findings list so the block is always present even when a rule only
   * produced an info line.
   */
  function contract(r) {
    var s = r.stats, o = [];
    function add(k, v) { o.push('<div>' + k + '</div><div class="mono">' + v + '</div>'); }
    var c12 = s.firstLayerFiber || {}, t = s.tools || {}, fb = s.fiber || {}, mf = s.machineFlags || {};
    var l1 = c12.verdict === 'none' ? 'no fibre on layer 1 \u2014 first layer is plastic'
      : c12.verdict === 'violation' ? '<span class="sev critical">VIOLATION</span> \u2014 ' + fmt(c12.structuralMm, 1) +
          ' mm of fibre in part geometry (' + esc(c12.structural.join(', ')) + ') on layer 1 of a non-fortified print'
      : c12.verdict === 'permitted-fortified' ? '<span class="sev info">permitted</span> \u2014 fortified print, ' +
          fmt(c12.structuralMm, 1) + ' mm of fibre in layer-1 geometry'
      : '<span class="sev info">ok</span> \u2014 layer-1 fibre is sacrificial priming/skirt only (' +
          fmt(c12.sacrificialMm, 1) + ' mm)';
    add('carbon on layer 1', l1);
    add('fortified by', 'CurrentSliceType=' + esc(r.settings.currentSliceType) +
      ' MustGenerateFiberPerimeters=' + esc(r.settings.mustGenerateFiberPerimeters));
    add('tool configuration',
      (t.observed === 'dual' ? 'dual-tool (FFF + CFC fibre)'
        : t.observed === 'fiber-only' ? 'fibre-only (CFC tool; plastic idle)'
        : t.observed === 'plastic-only' ? 'single-tool FFF (no fibre)' : '\u2014') +
      ' \u00b7 T0\u00d7' + fmt(t.t0) + ' / T1\u00d7' + fmt(t.t1));
    add('header PRINTING_MODE', esc(t.mode || 'absent') + ' \u2192 declares ' + esc(t.declared || 'unknown') +
      (t.declared && t.declared !== t.observed ? ' <span class="sev warning">contradicted</span>' : ''));
    add('fibre fed', fmt((fb.fedMm || 0) / 1000, 2) + ' m');
    add('fibre in the part', fmt((fb.depositedMm || 0) / 1000, 2) + ' m' +
      (fb.declaredTowM !== null && fb.declaredTowM !== undefined
        ? ' \u00b7 slicer declares ' + fmt(fb.declaredTowM, 2) + ' m' +
          (Math.abs((fb.depositedMm || 0) / 1000 - fb.declaredTowM) < 0.01 ? ' \u2713' : ' <span class="sev warning">\u2260</span>')
        : ''));
    add('fibre air-primed', fmt((fb.restartMm || 0) / 1000, 2) + ' m (' +
      fmt((fb.restartShare || 0) * 100) + ' %) \u2014 the U55 restart feed');
    add('cuts (M2800)', fmt(fb.cuts) + (fb.tailMm ? ' \u00b7 ' + fmt(fb.tailMm, 1) +
      ' mm tail = ' + fmt((fb.tailTotalMm || 0) / 1000, 2) + ' m trimmed' : ''));
    add('machine flags', mf.present && mf.present.length
      ? '<span class="sev info">' + mf.present.length + ' present</span>: ' +
        esc(mf.present.map(function (p) { return p.label + ' \u00d7' + p.count + '@' + p.line; }).join(', '))
      : '<span class="muted">none present \u2014 all ' + ((mf.absent || []).length) + ' absent</span>');
    if (!(mf.present && mf.present.length) && (mf.absent || []).length) {
      add('flags absent', esc(mf.absent.join(', ')));
    }
    return o.join('');
  }

  function kv(r) {
    var s = r.stats, se = r.settings, o = [];
    function add(k, v) { o.push('<div>' + k + '</div><div class="mono">' + esc(v === null || v === undefined ? '\u2014' : v) + '</div>'); }
    add('slicer', r.header.slicer);
    add('processor', r.header.processor);
    add('printing mode', r.header.mode);
    add('material', se.material);
    add('layers (header / parsed)', (r.header.layerCount || '?') + ' / ' + fmt(s.layers));
    add('moves (extrude / travel)', fmt(s.moves) + ' (' + fmt(s.extrudeMoves) + ' / ' + fmt(s.travelMoves) + ')');
    add('tool changes', fmt(s.toolChanges));
    add('plastic / fiber', fmt(s.plasticMm / 1000, 2) + ' m / ' + fmt(s.fiberMm / 1000, 2) + ' m');
    add('deposited volume', fmt(s.plasticVolMm3, 1) + ' mm\u00b3');
    add('bounding box', fmt(s.bbox.minx, 1) + '\u2013' + fmt(s.bbox.maxx, 1) + ' \u00d7 ' + fmt(s.bbox.miny, 1) + '\u2013' + fmt(s.bbox.maxy, 1) + ' mm');
    add('build area', (se.buildArea || []).join(' \u00d7 '));
    // Rocket names these Profile.DoZHop / MinLayerTimeForSlowing; Orca and Prusa
    // have no SESSION blob, so the label is the config key actually read.
    add(se.doZHopKey + ' / hop height', se.doZHop + ' / ' + se.zhopP);
    add(se.minLayerTimeKey, se.minLayerTime);
    add('Inset0Speed \u00d7 EWMM', se.inset0Speed + ' \u00d7 ' + se.inset0EWMM);
    add('seam distribution', se.seamDistributionPlastic);
    add('retract on layer change', se.retractOnLayerChange);
    add('retract only when crossing', se.retractOnlyWhenCrossing);
    add('first M204 / M205 / M203', (s.m204FirstLine === null ? 'none' : s.m204FirstLine) + ' / ' + s.m205 + ' / ' + s.m203);
    add('M1001 / M1002', s.m1001 + ' / ' + s.m1002);
    add('fan commands', fmt(s.fanEvents));
    add('seam markers / clusters', fmt(s.seamMarkers) + ' / ' + s.seamClusters + ' \u22653 layers');
    add('risk travels (void / air)', fmt(s.riskTravels) + ' (' + s.riskClass.void + ' / ' + s.riskClass.air + ')');
    add('worst unmitigated travel', (s.riskWorst ? fmt(s.riskWorst, 1) + ' mm @ line ' + s.riskWorstLine : 'none'));
    add('retract-after-travel', fmt(s.retractOrderDefects));
    add('Z-hops / against setting', fmt(s.zhopHops) + ' / ' + fmt(s.zhopHopsAgainstSetting));
    add('gap components', fmt(s.voidComps) + ' (' + fmt(s.voidWallComps) + ' bounded by a wall)');
    add('widest gap', fmt(s.voidWidestWall, 2) + ' mm');
    add('unsupported runs / max', fmt(s.unsupportedRuns) + ' / ' + fmt(s.unsupportedMax, 1) + ' mm');
    add('unsupported, fan off', fmt(s.unsupportedNoFanMm, 0) + ' mm');
    add('max volumetric flow', fmt(s.maxFlow, 1) + ' mm\u00b3/s @ line ' + s.maxFlowLine);
    var cv = Object.keys(s.customVerbs || {});
    add('undefined verbs', cv.length ? cv.join(', ') : 'none');
    return o.join('');
  }

  $('export').addEventListener('click', function () {
    if (!reports.length) return;
    var blob = new Blob([JSON.stringify({
      generated: new Date().toISOString(), engine: 'g-code-inspector.html',
      checks: FS3.CHECKS, reports: reports
    }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gcode-inspector-report.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });
})();
</script>
</body>
</html>
